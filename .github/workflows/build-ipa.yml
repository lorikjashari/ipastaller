name: Build IPA

# Builds the app on a GitHub-hosted macOS runner, so no Mac is needed.
#
# Two modes, chosen automatically:
#   no signing secrets -> compiles and uploads `HelloIPA-unsigned` (feed it to
#                         Sideloadly/AltStore, which signs it with your Apple ID)
#   signing secrets    -> exports a signed ad-hoc ipa, commits it, Vercel redeploys
#
# Signing secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com -> Membership)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect issuer ID
#   ASC_KEY_P8      full contents of AuthKey_XXXXXXXXXX.p8
#
# NOTE: secrets are aliased into job-level env because they cannot be used
# directly inside `if:` expressions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "HelloIPA.ipa"

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SIGNING_KEY: ${{ secrets.ASC_KEY_P8 }}
      UNSIGNED: ${{ secrets.ASC_KEY_P8 == '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Import App Store Connect key
        if: env.UNSIGNED == 'false'
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$SIGNING_KEY" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Archive (unsigned)
        if: env.UNSIGNED == 'true'
        working-directory: app
        run: |
          xcodebuild archive \
            -project HelloIPA.xcodeproj \
            -scheme HelloIPA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HelloIPA.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned ipa
        if: env.UNSIGNED == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/HelloIPA.xcarchive/Products/Applications/HelloIPA.app" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && ditto -c -k --sequesterRsrc --keepParent Payload HelloIPA-unsigned.ipa )
          ls -lh HelloIPA-unsigned.ipa
          echo "::notice::Unsigned ipa ready - give it to Sideloadly/AltStore to sign and install."

      - name: Upload unsigned artifact
        if: env.UNSIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HelloIPA-unsigned
          path: HelloIPA-unsigned.ipa
          if-no-files-found: error

      - name: Archive (signed)
        if: env.UNSIGNED == 'false'
        working-directory: app
        run: |
          xcodebuild archive \
            -project HelloIPA.xcodeproj \
            -scheme HelloIPA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HelloIPA.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export ad-hoc ipa
        if: env.UNSIGNED == 'false'
        working-directory: app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>release-testing</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HelloIPA.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Publish signed ipa
        if: env.UNSIGNED == 'false'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/export/HelloIPA.ipa"
          test -f "$SRC" || { echo "::error::Export produced no ipa"; exit 1; }

          cp "$SRC" HelloIPA.ipa
          ls -lh HelloIPA.ipa

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HelloIPA.ipa
          if git diff --cached --quiet; then
            echo "ipa unchanged, nothing to commit"
          else
            git commit -m "chore: build signed ipa from ${GITHUB_SHA::7}"
            git push
          fi

      - name: Upload signed artifact
        if: env.UNSIGNED == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: HelloIPA
          path: HelloIPA.ipa
          if-no-files-found: error
